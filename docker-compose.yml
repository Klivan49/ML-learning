version: "3.9"

services:
  file-sorter:
    build: .
    image: file-sorter:latest
    container_name: file-sorter
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XDG_RUNTIME_DIR=/tmp/runtime-appuser
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/home/appuser/.Xauthority:ro
      - ./data:/app/data
      - ./models:/app/models
      - ${INPUT_DIR:-./data/raw}:/app/input:ro
      - ${OUTPUT_DIR:-./data/sorted}:/app/output
    network_mode: host

  file-sorter-cli:
    build: .
    image: file-sorter:latest
    container_name: file-sorter-cli
    entrypoint: ["python", "scripts/sort_files.py"]
    volumes:
      - ./models:/app/models:ro
      - ${INPUT_DIR:-./data/raw}:/app/input:ro
      - ${OUTPUT_DIR:-./data/sorted}:/app/output
